name: omniversify_social_app
description: "A social profile app showcasing interests, powered by Omniversify Widget."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0-221.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  omniversify_widget:
    path: ../omniversify_widget
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  uuid: ^4.5.1
  intl: ^0.20.3
  cached_network_image: ^4.0.0
  mobile_scanner: ^7.0.0
  permission_handler: ^13.0.1
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  audio_service: ^0.18.19
  shared_preferences: ^2.5.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  flutter_dotenv: ^6.0.1
  http: ^1.2.0
  camera: ^0.12.1
  flutter_taglib: ^1.5.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  home_widget: ^0.10.0
  image_picker: ^1.2.3
  app_links: ^7.2.1
  file_picker: ^13.1.0
  koni_archive: ^0.9.0
  pdfx: ^2.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only the reader tests use this: it writes the zips the reader unpacks,
  # so the fixture and the unpacker come from two different implementations.
  archive: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/tones/
    - assets/achievements/Black/
    - assets/achievements/Bronze/
    - assets/achievements/Gold/
    - assets/achievements/Silver/
    - assets/logo/logo.webp
    - assets/logo/favicon.svg
